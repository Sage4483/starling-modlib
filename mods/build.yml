name: build-zh
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: checkout-own
        uses: actions/checkout@v4
      - name: prep
        run: |
          set -x
          test -f kit.zip || (echo "MISSING kit.zip in repo root"; exit 1)
          unzip -o kit.zip -d /tmp/kit
          curl -L -o /tmp/src.tar.gz "https://github.com/starling-client/starling/archive/ac874422ed8f892505ff73d67ae486ecfee7a516.tar.gz"
          tar xzf /tmp/src.tar.gz
          mv starling-ac874422ed8f892505ff73d67ae486ecfee7a516 starling
          cd starling
          git init -q .
          git apply --verbose /tmp/kit/汉化改动.patch || patch -p1 --forward < /tmp/kit/汉化改动.patch
          cp /tmp/kit/CJK-Regular.ttf /tmp/kit/CJK-Medium.ttf /tmp/kit/CJK-Bold.ttf crates/horizon-theme/fonts/
          sed -i 's/^codegen-units = 1$/codegen-units = 256/' Cargo.toml
          echo "HORIZON_ANDROID_KEYSTORE=/tmp/kit/starling.keystore" >> $GITHUB_ENV
          echo "HORIZON_ANDROID_KEY_ALIAS=starling" >> $GITHUB_ENV
          echo "HORIZON_ANDROID_STORE_PASSWORD=starling123" >> $GITHUB_ENV
          echo "HORIZON_ANDROID_KEY_PASSWORD=starling123" >> $GITHUB_ENV
          echo "中文词条数: $(grep -c 推荐 crates/horizon-client/src/android_control_ui.rs)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: target
        run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starling
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: sdk
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            export ANDROID_HOME=$HOME/android-sdk
            mkdir -p $ANDROID_HOME/cmdline-tools
            curl -sSLo /tmp/cli.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cli.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          fi
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          export JAVA_HOME=${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which java))))}
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-36"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
      - name: compile
        working-directory: starling
        run: |
          java -version
          echo "NDK=$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a --platform 26 build --profile quick -p horizon-android
      - name: package
        working-directory: starling
        run: |
          python3 packaging/android/build_apk.py --no-build --profile quick
          find . -name "*.apk" | head
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: starling/**/*.apk
          if-no-files-found: warn
          retention-days: 30
