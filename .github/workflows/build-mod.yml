name: build-modlib

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: prepare
        run: |
          set -x
          ls -la
          test -f kit.zip || (echo "NO kit.zip IN REPO ROOT"; exit 1)
          unzip -o kit.zip -d /tmp/kit
          curl -L -o /tmp/src.tar.gz "https://github.com/starling-client/starling/archive/ac874422ed8f892505ff73d67ae486ecfee7a516.tar.gz"
          tar xzf /tmp/src.tar.gz
          mv starling-ac874422ed8f892505ff73d67ae486ecfee7a516 starling
          cd starling
          git init -q .
          git config user.email build@local
          git config user.name build
          git apply --verbose /tmp/kit/hanhua.patch || patch -p1 --forward < /tmp/kit/hanhua.patch
          cp /tmp/kit/CJK-Regular.ttf /tmp/kit/CJK-Medium.ttf /tmp/kit/CJK-Bold.ttf crates/horizon-theme/fonts/
          sed -i 's/^codegen-units = 1$/codegen-units = 256/' Cargo.toml
          git add -A
          git commit -qm "kernel and zh"
          git rev-parse --short HEAD
          echo "HORIZON_ANDROID_KEYSTORE=/tmp/kit/starling.keystore" >> $GITHUB_ENV
          echo "HORIZON_ANDROID_KEY_ALIAS=starling" >> $GITHUB_ENV
          echo "HORIZON_ANDROID_STORE_PASSWORD=starling123" >> $GITHUB_ENV
          echo "HORIZON_ANDROID_KEY_PASSWORD=starling123" >> $GITHUB_ENV

      - name: bundles
        run: |
          set -e
          mkdir -p /tmp/bundles
          if [ -d mods ]; then
            for f in $(find mods -name '*.hnmod' -o -name '*.hmod'); do
              echo "found $f"
              rm -rf /tmp/unz
              mkdir -p /tmp/unz
              unzip -q -o "$f" -d /tmp/unz
              id=$(python3 -c "import json;print(json.load(open('/tmp/unz/horizon-native.json'))['id'])")
              mkdir -p "/tmp/bundles/$id"
              cp -r "/tmp/unz/mixins/$id/." "/tmp/bundles/$id/"
              echo "bundle $id ready"
            done
          fi
          ls -la /tmp/bundles

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: starling

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: sdk
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sSLo /tmp/cli.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cli.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          export JAVA_HOME=${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which java))))}
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-36"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: build
        run: |
          set -x
          java -version
          echo "NDK=$ANDROID_NDK_HOME"
          bundles=$(ls -d /tmp/bundles/* 2>/dev/null | tr '\n' ' ')
          echo "bundles=$bundles"
          bash starling/packaging/android/native_build.sh starling /tmp/out $bundles
          ls -la /tmp/out
          cat /tmp/out/build.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: native-lib
          path: |
            /tmp/out/libhorizon_android.so
            /tmp/out/build.json
            /tmp/out/*.apk
          if-no-files-found: warn
          retention-days: 30
